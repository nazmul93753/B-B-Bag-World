<!DOCTYPE html>
<html>
<head>
<title>B&B Bag World</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:30px;
}

header h1{
    font-size:38px;
    margin:0;
}

.hero{
    background:white;
    text-align:center;
    padding:50px 20px;
}

.hero h2{
    font-size:32px;
}

.hero button{
    background:#111;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:5px;
    cursor:pointer;
}

.products{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
    padding:40px;
}

.card{
    background:white;
    width:250px;
    text-align:center;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

.card img{
    width:200px;
    height:200px;
    object-fit:cover;
}

.card h3{
    font-size:22px;
}

footer{
    background:#111;
    color:white;
    text-align:center;
    padding:20px;
}
</style>

</head>

<body>

<header>
<h1>B&B Bag World</h1>
<p>Premium Bags Collection</p>
</header>


<section class="hero">
<h2>Welcome To B&B Bag World</h2>
<p>Your destination for stylish and quality bags.</p>
<button>Shop Now</button>
</section>


<section class="products">

<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Fashion Bag</h3>
<p>Beautiful bags for daily use</p>
</div>


<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Travel Bag</h3>
<p>Strong and comfortable travel bags</p>
</div>


<div class="card">
<img src="https://via.placeholder.com/200">
<h3>Ladies Bag</h3>
<p>Elegant design for modern women</p>
</div>

</section>


<footer>
<p>© 2026 B&B Bag World</p>
<p>Quality Bags | Best Service</p>
</footer>


</body>
</html>
